<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SensitivityOS</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header class="header">
        <h1>SensitivityOS</h1>
        <p>Contextual Sensitivity Classification Framework</p>
    </header>

    <main class="container">

        <section class="card">

            <h2>Detected Entities</h2>

            <div id="entities"></div>

        </section>

        <section class="card">

            <h2>Semantic Sensitivity Graph</h2>

            <div id="graph"></div>

        </section>

        <section class="card">

            <h2>Analytics Dashboard</h2>

            <div class="analytics-grid">

                <div class="metric-card">
                    <h3>Total Entities</h3>
                    <p id="total-entities">0</p>
                </div>

                <div class="metric-card">
                    <h3>Critical Items</h3>
                    <p id="critical-count">0</p>
                </div>

                <div class="metric-card">
                    <h3>Review Queue Size</h3>
                    <p id="review-count">0</p>
                </div>

            </div>

            <canvas id="sensitivityChart"></canvas>

        </section>

        <section class="card">

            <h2>Explainability Explorer</h2>

            <div id="explainability"></div>

        </section>

        <section class="card">

            <h2>LLM Analysis</h2>

            <div id="llm-analysis"></div>

        </section>

        <section class="card">

            <h2>Human Review Queue</h2>

            <div id="review-queue"></div>

            <div class="review-form">

                <h3>Submit Review Decision</h3>

                <label>Entity</label>
                <input type="text" id="review-entity">

                <label>Original Sensitivity</label>
                <input type="text" id="review-original">

                <label>Corrected Sensitivity</label>

                <select id="review-corrected">

                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                    <option value="critical">Critical</option>

                </select>

                <label>Relationship</label>
                <input type="text" id="review-relationship">

                <label>Confidence Adjustment</label>
                <input
                    type="number"
                    id="review-adjustment"
                    step="0.01"
                    value="0.05">

                <button id="submit-review">
                    Submit Review
                </button>

                <div id="review-response"></div>

            </div>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script
        type="text/javascript"
        src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js">
    </script>

    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>

</body>

</html>
